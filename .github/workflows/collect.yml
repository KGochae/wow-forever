# 매시간 길드 수집 → wow-forever Worker → Cloudflare R2 (wow-forever-data)
#   R2 API 키 없이 Worker의 /forever/ingest 로 업로드 (INGEST_TOKEN 인증)
#
# 필요한 저장소 설정 (Settings → Secrets and variables → Actions)
#   Secrets : BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, INGEST_TOKEN
#   Variables (선택): WORKER_URL(기본 https://wow-forever.wowak.workers.dev), GUILD_SLUG(기본 같이와포하자), REGION(기본 kr)
#
# 수동 실행: Actions 탭 → collect → Run workflow (force=true 면 전원 재수집 + 특성 트리 재생성)
# 예약 실행: wow-forever Worker의 Cron Trigger가 매시 58분에 workflow_dispatch로 호출 (worker/wrangler.toml)
#   GitHub의 schedule 이벤트는 쓰지 않음 (넣으면 수집이 이중으로 실행됨)
name: collect

on:
  workflow_dispatch:
    inputs:
      force:
        description: "전원 재수집 (첫 배포·데이터 형식 변경 시)"
        type: boolean
        default: false

# 같은 시간대 실행이 겹치지 않게 (이전 실행이 끝날 때까지 대기)
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul # 로그·요약을 한국시간 기준으로
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector # 수집기만 받음 (사이트 코드 불필요)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: 수집기 패키지 설치
        run: npm ci --prefix collector

      - name: 수집 → Worker → R2
        working-directory: collector
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://wow-forever.wowak.workers.dev' }}
          GUILD_SLUG: ${{ vars.GUILD_SLUG || '같이와포하자' }}
          REGION: ${{ vars.REGION || 'kr' }}
          STORAGE: worker
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          node collect.mjs 2>&1 | tee collect.log
          {
            echo "### 수집 결과 ($(date '+%Y-%m-%d %H:%M') KST)"
            echo '```'
            cat collect.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
