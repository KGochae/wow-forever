# WOW_FOREVER 전용 Worker (WEB_PROJECT의 wow-proxy와 별개)
name = "wow-forever"
main = "src/index.mjs"
compatibility_date = "2025-09-01"

# 데이터 (수집기·Update 버튼이 쓰고, 사이트가 읽음)
[[r2_buckets]]
binding = "DATA"
bucket_name = "wow-forever-data"

# 3D 모델 캐시 — 기존 버킷 재사용 (WEB_PROJECT는 tbc/ 경로, 여기는 classicplus/ 경로라 겹치지 않음)
[[r2_buckets]]
binding = "MODEL_CACHE"
bucket_name = "wow-model-cache"

# Update 버튼 쿨다운·IP 제한 (wrangler kv namespace create RATE 로 생성)
[[kv_namespaces]]
binding = "RATE"
id = "9eea620a1f2e4f55914d38944026570a"

[vars]
REGION = "kr"
# 사이트 주소 (쉼표 구분: 운영 Vercel 대표 주소 2개 + 로컬)
ALLOWED_ORIGINS = "https://wafo-haja.vercel.app,https://wow-forever-bay.vercel.app,https://wow-forever-chaechae.vercel.app,http://localhost:3000"
REFRESH_COOLDOWN_SEC = "600"
REFRESH_IP_PER_HOUR = "20"
# 예약 수집: Cron Trigger가 이 워크플로를 workflow_dispatch로 실행
GH_REPO = "KGochae/wow-forever"
GH_WORKFLOW = "collect.yml"
GH_REF = "main"

# 매시 58분 (Cloudflare cron은 UTC 기준이지만 분만 지정하므로 KST에서도 매시 58분)
[triggers]
crons = ["58 * * * *"]

# 시크릿 (wrangler secret put): BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET, INGEST_TOKEN, GH_DISPATCH_TOKEN
